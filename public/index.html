<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4fb">
  <meta name="78579d7798af5fd100ce65fc79be9e3e89a522e7" content="78579d7798af5fd100ce65fc79be9e3e89a522e7" />
  <title>WallRush — Block their way</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='8' y='14' width='84' height='30' rx='8' fill='%237c5cff'/><rect x='8' y='56' width='40' height='30' rx='8' fill='%237c5cff'/><rect x='56' y='56' width='36' height='30' rx='8' fill='%23b3a1ff'/></svg>">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- Opens the connection to the ad host early. Costs one handshake and no
       download, and takes that handshake off the wait once Support is tapped. -->
  <link rel="preconnect" href="https://js.onclckmn.com" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=96">
  <!-- Are we inside somebody else's page? Every game portal forbids running
       your own ads inside theirs, and the ad scripts below start the moment
       the parser reaches them — long before any module could stop one. So the
       answer has to be known here, in the head, before anything else runs. -->
  <script>
    try { window.WR_EMBED = window.self !== window.top; }
    catch (e) { window.WR_EMBED = true; }   // a cross-origin parent throws, which is itself a yes
    if (window.WR_EMBED) document.documentElement.className += ' embedded';
  </script>
</head>
<body>
  <div id="app">

    <!-- Offline, the game opened and looked completely normal: online buttons
         bright and pressable, leading to a wait that never ended. This says so
         once, at the top of every screen, and the buttons that cannot work go
         grey underneath. -->
    <div id="offline-bar" hidden>📴 <span data-i18n="offline_bar"></span></div>

    <!-- ============ HOME ============ -->
    <section class="screen active" id="screen-home">
      <div id="install-banner" hidden>
        <span class="ib-icon">📲</span>
        <span class="ib-text" id="install-banner-text" data-i18n="install_banner"></span>
        <button id="install-banner-go" data-i18n="install_now"></button>
        <button id="install-banner-close" aria-label="close">✕</button>
      </div>
      <header class="home-head">
        <!-- Language is reachable in one tap from the very first screen: the
             globe plus the code is readable whatever language you speak. -->
        <button class="lang-fab" id="btn-lang" aria-label="Language">🌐 EN</button>
        <div class="logo">
          <div class="logo-mark"><span></span><span></span><span></span></div>
          <h1>WallRush</h1>
        </div>
        <p class="tagline" data-i18n="tagline"></p>
        <div class="head-pills">
          <div class="online-pill"><span class="dot"></span><b id="online-count">0</b>&nbsp;<span data-i18n="online_count"></span></div>
          <!-- the streak is the reason to come back tomorrow, so it greets you.
               Tapping it opens everything the flame does — including the offer
               to get a broken streak back. A banner across the home screen was
               louder than the thing it was offering. -->
          <button class="streak-pill" id="streak-pill" hidden>
            <span class="flame fl-1" id="streak-flame">🔥</span><b id="streak-count">0</b>
          </button>
        </div>
      </header>

      <div class="cards">
        <button class="card card-primary" id="btn-quick">
          <div class="card-icon">⚡</div>
          <div class="card-text"><b data-i18n="quick_match"></b><small data-i18n="quick_match_sub"></small></div>
          <div class="card-arrow">›</div>
        </button>
        <div class="cards-row">
          <button class="card card-violet" id="btn-online">
            <div class="card-icon">🌐</div>
            <div class="card-text"><b data-i18n="play_online"></b><small data-i18n="play_online_sub"></small></div>
          </button>
          <button class="card card-violet2" id="btn-friend">
            <div class="card-icon">🤝</div>
            <div class="card-text"><b data-i18n="play_friend"></b><small data-i18n="play_friend_sub"></small></div>
          </button>
        </div>
        <button class="card card-light" id="btn-ai">
          <div class="card-icon dark">🤖</div>
          <div class="card-text"><b data-i18n="play_ai"></b><small data-i18n="play_ai_sub"></small></div>
          <div class="card-arrow">›</div>
        </button>
        <button class="card card-light" id="btn-how">
          <div class="card-icon dark">📖</div>
          <div class="card-text"><b data-i18n="how_title"></b></div>
          <div class="card-arrow">›</div>
        </button>
      </div>

      <!-- support the project / buy advertising — visible, but below the game -->
      <div class="side-row">
        <button class="side-btn side-support" id="btn-open-support" data-i18n="support_short"></button>
        <button class="side-btn side-ads" id="btn-open-ads" data-i18n="ads_short"></button>
      </div>

      <div class="social-block">
        <p class="social-label" data-i18n="follow_us"></p>
        <div class="social-row">
          <a class="soc soc-ig" href="https://www.instagram.com/wall_rush_" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <!-- outline glyph next to two solid ones: the strokes are heavier
                 than the real mark so all three read at the same weight -->
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.7" y="2.7" width="18.6" height="18.6" rx="5.6" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="12" cy="12" r="4.5" fill="none" stroke="#fff" stroke-width="2.4"/><circle cx="17.5" cy="6.5" r="1.5" fill="#fff"/></svg>
          </a>
          <a class="soc soc-tt" href="https://www.tiktok.com/@wall_rush_" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M21 8.6a6.9 6.9 0 0 1-4.4-1.6v6.9a5.9 5.9 0 1 1-5.9-5.9c.3 0 .6 0 .9.1v3a2.9 2.9 0 1 0 2 2.8V2.2h2.9A4.1 4.1 0 0 0 21 6.2z"/></svg>
          </a>
          <a class="soc soc-yt" href="https://www.youtube.com/@wall_rush" target="_blank" rel="noopener noreferrer" aria-label="YouTube">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M22 8.2a3 3 0 0 0-2.1-2.1C18 5.5 12 5.5 12 5.5s-6 0-7.9.6A3 3 0 0 0 2 8.2 31 31 0 0 0 1.7 12 31 31 0 0 0 2 15.8a3 3 0 0 0 2.1 2.1c1.9.6 7.9.6 7.9.6s6 0 7.9-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 22.3 12 31 31 0 0 0 22 8.2zM10 15V9l5.2 3z"/></svg>
          </a>
        </div>
        <nav class="legal-links">
          <a data-legal="rules" data-i18n="legal_rules"></a><span>·</span>
          <a data-legal="help" data-i18n="legal_help"></a><span>·</span>
          <a data-legal="terms" data-i18n="legal_terms"></a><span>·</span>
          <a data-legal="privacy" data-i18n="legal_privacy"></a>
        </nav>
      </div>

      <!-- HilltopAds 300x100 banner: lives inside the home screen, so it shows
           in the menu only and is never present on the game screen. -->
      <div class="ad-slot" aria-hidden="true">
        <script>
        if (!window.WR_EMBED) (function(osjgznp){
        var d = document,
            s = d.createElement('script'),
            l = d.scripts[d.scripts.length - 1];
        s.settings = osjgznp || {};
        s.src = "\/\/massivesalad.com\/b\/XoVds\/d.G\/la0_Y\/WQcM\/Oe\/mq9SufZ\/UWl\/k\/P\/THcly\/NBTCUL2NMIT-MAtLNmzVIO1tNmT\/YyxKNCwO";
        s.async = true;
        s.referrerPolicy = 'no-referrer-when-downgrade';
        l.parentNode.insertBefore(s, l);
        })({})
        </script>
      </div>
    </section>

    <!-- ============ ROOMS (public lobby) ============ -->
    <section class="screen" id="screen-rooms">
      <header class="sub-head">
        <button class="btn-back" data-back>‹</button>
        <h2 data-i18n="rooms_title"></h2>
      </header>
      <div id="rooms-list" class="rooms-list"></div>
      <button class="btn-big" id="btn-create-room" data-i18n="create_room"></button>
    </section>

    <!-- ============ FRIEND (private code) ============ -->
    <section class="screen" id="screen-friend">
      <header class="sub-head">
        <button class="btn-back" data-back>‹</button>
        <h2 data-i18n="friend_title"></h2>
      </header>
      <div class="friend-box">
        <button class="btn-big" id="btn-friend-create" data-i18n="friend_create"></button>
        <div class="divider">•</div>
        <p class="hint" data-i18n="friend_enter"></p>
        <input id="friend-code-input" class="input" maxlength="6" autocomplete="off" autocapitalize="characters" data-i18n-ph="code_placeholder">
        <button class="btn-big btn-outline" id="btn-friend-join" data-i18n="friend_join"></button>
      </div>
    </section>

    <!-- ============ SUPPORT: watch an ad, or donate (overlay) ============ -->
    <div class="overlay" id="overlay-support" hidden>
      <div class="modal">
        <div class="modal-emoji">💛</div>
        <h2 data-i18n="support_title"></h2>
        <p class="hint" data-i18n="support_intro"></p>

        <!-- two ways to help, each in its own card so neither reads as the
             fine print of the other -->
        <div class="opt-card">
          <div class="opt-head"><span class="opt-ico">📺</span><b data-i18n="support_watch_title"></b></div>
          <p class="opt-sub" data-i18n="support_watch_sub"></p>
          <button class="btn-big" id="support-watch" data-i18n="support_watch"></button>
        </div>

        <div class="opt-or"><span data-i18n="or_word"></span></div>

        <div class="opt-card">
          <div class="opt-head"><span class="opt-ico">💸</span><b data-i18n="support_donate_title"></b></div>
          <p class="opt-sub" data-i18n="support_donate_sub"></p>
          <div class="wallet">
            <span class="wallet-net">USDT · TRC20</span>
            <code id="wallet-addr">TJohpPCR4LJPm9EZiKqoSLWaH7bZhX7AiP</code>
            <button id="wallet-copy" data-i18n="copy"></button>
          </div>
        </div>

        <p class="opt-foot" data-i18n="support_where"></p>
        <div class="modal-buttons">
          <button class="btn-big btn-outline" id="support-close" data-i18n="legal_close"></button>
        </div>
      </div>
    </div>

    <!-- ============ ADVERTISE WITH US ============ -->
    <!-- A screen of its own rather than a box floating over a blurred menu.
         This is the one page a possible advertiser reads end to end, so it
         gets the whole width: what the audience is, in numbers, before what
         can be bought. -->
    <section class="screen" id="screen-ads">
      <header class="sub-head">
        <button class="btn-back" data-back>‹</button>
        <h2 data-i18n="ads_short_plain"></h2>
      </header>

      <div class="ads-page">
        <div class="ads-hero">
          <div class="modal-emoji">📣</div>
          <h3 data-i18n="ads_title"></h3>
          <p class="hint" data-i18n="ads_intro"></p>
        </div>

        <!-- The numbers come first: an advertiser decides on reach, and
             sending them away to ask for it loses most of them. Deliberately
             rounded down — every one of them holds on the game's worst day. -->
        <div class="ads-stats">
          <div class="ads-stat"><b>5 000+</b><small data-i18n="ads_l_day"></small></div>
          <div class="ads-stat"><b>50 000+</b><small data-i18n="ads_l_month"></small></div>
          <div class="ads-stat"><b>10 000+</b><small data-i18n="ads_l_match"></small></div>
          <div class="ads-stat"><b>30+</b><small data-i18n="ads_l_geo"></small></div>
        </div>

        <div class="fmt-list">
          <div class="fmt"><span class="fmt-ico">🌍</span><div><b data-i18n="ads_f0"></b><small data-i18n="ads_f0_sub"></small></div></div>
          <div class="fmt"><span class="fmt-ico">🖼️</span><div><b data-i18n="ads_f1"></b><small data-i18n="ads_f1_sub"></small></div></div>
          <div class="fmt"><span class="fmt-ico">🤝</span><div><b data-i18n="ads_f2"></b><small data-i18n="ads_f2_sub"></small></div></div>
          <div class="fmt"><span class="fmt-ico">🎯</span><div><b data-i18n="ads_f3"></b><small data-i18n="ads_f3_sub"></small></div></div>
        </div>

        <div class="ads-cta">
          <b data-i18n="ads_cta"></b>
          <p class="hint" data-i18n="ads_foot"></p>
          <!-- Two ways in, both the same size. The email used to be a footnote
               under the button; half of the people who buy advertising work by
               email and want to see the address, not a word to tap. -->
          <a class="btn-big" id="ads-contact" href="https://t.me/Karoboev" target="_blank" rel="noopener noreferrer" data-i18n="ads_tg"></a>
          <a class="btn-big btn-outline ads-mail" href="mailto:kharatovkarif@gmail.com?subject=WallRush%20—%20advertising">✉️ kharatovkarif@gmail.com</a>
          <!-- a desktop browser with no mail client makes mailto: do nothing,
               so the address can always be taken away by hand -->
          <button class="ads-copy" id="ads-email-copy" data-i18n="ads_copy_mail"></button>
        </div>
      </div>
    </section>

    <!-- ============ LANGUAGE PICKER (overlay) ============ -->
    <div class="overlay" id="overlay-lang" hidden>
      <div class="modal">
        <h2>🌐 <span data-i18n="lang_label"></span></h2>
        <div class="lang-list" id="lang-list"></div>
        <div class="modal-buttons">
          <button class="btn-big btn-outline" id="lang-close" data-i18n="legal_close"></button>
        </div>
      </div>
    </div>

    <!-- ============ LEGAL / INFO PAGES (overlay) ============ -->
    <div class="overlay" id="overlay-legal" hidden>
      <div class="modal legal-modal">
        <h2 id="legal-title"></h2>
        <p class="doc-updated" id="legal-updated" hidden></p>
        <div class="legal-text" id="legal-text"></div>
        <div class="modal-buttons">
          <button class="btn-big" id="legal-close" data-i18n="legal_close"></button>
        </div>
      </div>
    </div>

    <!-- ============ CREATE ROOM SETTINGS (overlay) ============ -->
    <div class="overlay" id="overlay-create" hidden>
      <div class="modal">
        <h2 data-i18n="create_room"></h2>
        <div class="cr-group">
          <p class="cr-label" data-i18n="mode_label"></p>
          <div class="cr-opts" id="cr-mode">
            <button data-val="duel" class="on">⚔️ <span data-i18n="duel_title"></span></button>
            <button data-val="race">🏁 <span data-i18n="race_title"></span></button>
          </div>
          <p class="hint" id="cr-mode-hint"></p>
        </div>
        <div class="cr-group">
          <p class="cr-label" data-i18n="walls_label"></p>
          <div class="cr-opts" id="cr-walls">
            <button data-val="10" class="on">10 🧱</button>
            <button data-val="15" hidden>15 🧱</button>
          </div>
        </div>
        <div class="cr-group">
          <p class="cr-label" data-i18n="time_label"></p>
          <div class="cr-opts" id="cr-time">
            <button data-val="0">∞ <span data-i18n="no_time"></span></button>
            <button data-val="3">3 <span data-i18n="min_short"></span></button>
            <button data-val="5" class="on">5 <span data-i18n="min_short"></span></button>
          </div>
          <p class="hint" data-i18n="no_time_hint"></p>
        </div>
        <div class="modal-buttons">
          <button class="btn-big" id="cr-create" data-i18n="create_room"></button>
          <button class="btn-big btn-outline" id="cr-cancel" data-i18n="cancel"></button>
        </div>
      </div>
    </div>

    <!-- ============ AI DIFFICULTY ============ -->
    <section class="screen" id="screen-ai">
      <header class="sub-head">
        <button class="btn-back" data-back>‹</button>
        <h2 data-i18n="ai_title"></h2>
      </header>
      <div class="cards">
        <button class="card card-light" id="ai-easy">
          <div class="card-icon lvl-easy">🙂</div>
          <div class="card-text"><b data-i18n="ai_easy"></b><small data-i18n="ai_easy_sub"></small></div>
          <div class="card-arrow">›</div>
        </button>
        <button class="card card-light" id="ai-normal">
          <div class="card-icon lvl-normal">😎</div>
          <div class="card-text"><b data-i18n="ai_normal"></b><small data-i18n="ai_normal_sub"></small></div>
          <div class="card-arrow">›</div>
        </button>
        <button class="card card-light" id="ai-hard">
          <div class="card-icon lvl-hard">🔥</div>
          <div class="card-text"><b data-i18n="ai_hard"></b><small data-i18n="ai_hard_sub"></small></div>
          <div class="card-arrow">›</div>
        </button>
        <button class="card card-light" id="ai-hardcore">
          <div class="card-icon lvl-hardcore">💀</div>
          <div class="card-text"><b data-i18n="ai_hardcore"></b><small data-i18n="ai_hardcore_sub"></small></div>
          <div class="card-arrow">›</div>
        </button>
      </div>
    </section>

    <!-- ============ WAITING ============ -->
    <section class="screen" id="screen-waiting">
      <div class="waiting-box">
        <div class="spinner"></div>
        <h2 data-i18n="waiting_opponent"></h2>
        <!-- A link is what actually travels: dictating a six-character code
             loses most invitations before they are sent. -->
        <div id="waiting-code" class="code-box" hidden>
          <p class="hint" data-i18n="invite_hint"></p>
          <button class="btn-big" id="invite-share" data-i18n="invite_share"></button>
          <p class="invite-or" data-i18n="invite_code_label"></p>
          <div class="code" id="room-code-value"></div>
        </div>
        <button class="btn-big btn-outline" id="btn-cancel-wait" data-i18n="cancel"></button>
      </div>
    </section>

    <!-- ============ GAME ============ -->
    <section class="screen" id="screen-game">
      <div class="game-head">
        <div class="g-logo">
          <div class="logo-mark sm"><span></span><span></span><span></span></div>
          <b>WallRush</b>
        </div>
        <button class="btn-giveup" id="btn-resign">⚑ <span data-i18n="resign"></span></button>
      </div>

      <div class="vs-row">
        <div class="p-pill" id="chip-me">
          <div class="chip-ball"><span class="rank-ic" id="me-rank"></span></div>
          <div class="pill-info"><b id="me-nick"></b><small><span id="me-walls">10</span> 🧱</small></div>
          <div class="chip-clock" id="me-clock">5:00</div>
        </div>
        <div class="vs-badge">VS</div>
        <div class="p-pill" id="chip-opp">
          <div class="chip-ball"><span class="rank-ic" id="opp-rank"></span></div>
          <div class="pill-info"><b id="opp-nick"></b><small><span id="opp-walls">10</span> 🧱</small></div>
          <div class="chip-clock" id="opp-clock">5:00</div>
        </div>
      </div>

      <div class="board-wrap">
        <div class="zone-label zone-top" id="zone-top"></div>
        <div id="board"></div>
        <div class="zone-label zone-bottom" id="zone-bottom"></div>
        <div id="emoji-pop" class="emoji-pop" hidden></div>
      </div>

      <div class="wall-dock" id="wall-dock">
        <div class="dock-count">🧱 <b id="dock-walls">10</b></div>
        <button class="dock-handle" id="drag-h" aria-label="horizontal wall"><span class="dh-bar h"></span></button>
        <button class="dock-handle" id="drag-v" aria-label="vertical wall"><span class="dh-bar v"></span></button>
      </div>

      <div class="game-hint"><span id="game-hint" data-i18n="gesture_hint"></span></div>

      <div class="game-bottom2">
        <div class="turn-pill" id="turn-banner"></div>
        <div class="emoji-bar" id="emoji-bar">
          <button data-emoji="😂">😂</button>
          <button data-emoji="🫡">🫡</button>
          <button data-emoji="🤝">🤝</button>
          <button data-emoji="😡">😡</button>
        </div>
      </div>
    </section>

    <!-- ============ GAME OVER (overlay) ============ -->
    <div class="overlay" id="overlay-gameover" hidden>
      <div class="confetti" id="confetti"></div>
      <div class="modal win-modal">
        <div class="result-emoji" id="result-emoji">🏆</div>
        <h1 class="result-title" id="result-title"></h1>
        <p id="result-reason" class="hint"></p>
        <div class="result-stats">
          <div class="rs-side">
            <div class="rs-ball" id="rs-ball-me"></div>
            <b id="rs-nick-me"></b><small id="rs-tag-me"></small>
          </div>
          <div class="rs-mid">VS</div>
          <div class="rs-side">
            <div class="rs-ball" id="rs-ball-opp"></div>
            <b id="rs-nick-opp"></b><small id="rs-tag-opp"></small>
          </div>
        </div>
        <!-- ladder result: the number people come back for -->
        <div class="pts-row" id="pts-row" hidden>
          <span class="pts-delta" id="pts-delta"></span>
          <span class="pts-total" id="pts-total"></span>
        </div>
        <p class="rank-up" id="rank-up" hidden></p>
        <p class="streak-line" id="streak-line" hidden></p>
        <p class="hint" id="pts-note" hidden></p>
        <div class="modal-buttons">
          <!-- This screen is the most valuable place in the game: it is seen
               about sixty thousand times a day. The invite here brings around
               388 new players daily — over a tenth of all growth — while the
               support ad it replaced earned cents. So the invite gets the spot
               and support lives on the home screen. -->
          <button class="btn-big" id="btn-rematch" data-i18n="rematch"></button>
          <button class="btn-big btn-ghost" id="btn-invite-friend" data-i18n="invite_short"></button>
          <button class="btn-big btn-ghost" id="btn-replay" data-i18n="replay"></button>
          <button class="btn-big btn-outline" id="btn-to-menu" data-i18n="back_menu"></button>
        </div>
        <p id="rematch-status" class="hint" hidden></p>
      </div>
    </div>

    <!-- ============ SUPPORT AD (video, opens only on tap) ============ -->
    <!-- The advertising script is not on the page until this opens, so the
         96% who never tap Support never load a byte of it. -->
    <div class="overlay ad-overlay" id="overlay-ad" hidden>
      <div class="ad-box">
        <div class="ad-head">
          <span class="ad-label" data-i18n="ad_label"></span>
          <!-- Hidden by default: the ad brings its own close button, and two on
               one window is one too many. This one appears only as a way out if
               the ad is somehow still here long after any ad should be. -->
          <button class="ad-close" id="ad-close" aria-label="close" hidden>✕</button>
        </div>
        <!-- where the network is told to put its player; it does not always
             oblige, so nothing here depends on the player landing inside -->
        <div id="ad-video-slot"></div>
        <p class="ad-note" id="ad-note" data-i18n="ad_loading"></p>
      </div>
    </div>

    <!-- ============ STREAK MILESTONE (full-screen celebration) ============ -->
    <!-- Sits above the result screen: the day someone's week of coming back
         pays off should not slip by as one more line of text. -->
    <div class="overlay streak-overlay" id="overlay-streak" hidden>
      <div class="sparks" id="streak-sparks"></div>
      <div class="cel">
        <div class="cel-glow"></div>
        <span class="flame fl-1 cel-flame" id="cel-flame">🔥</span>
        <div class="cel-num" id="cel-num">0</div>
        <h2 class="cel-title" id="cel-title"></h2>
        <p class="cel-sub" data-i18n="streak_wow"></p>
        <button class="btn-big" id="cel-close" data-i18n="ok_word"></button>
      </div>
    </div>

    <!-- ============ REPLAY CONTROLS (over the game board) ============ -->
    <div id="replay-bar" hidden>
      <div class="replay-inner">
        <button class="rp-btn" id="rp-start" aria-label="start">⏮</button>
        <button class="rp-btn" id="rp-prev" aria-label="prev">⏴</button>
        <button class="rp-btn rp-play" id="rp-play" aria-label="play">▶</button>
        <button class="rp-btn" id="rp-next" aria-label="next">⏵</button>
        <div class="rp-track"><div class="rp-fill" id="rp-fill"></div></div>
        <span class="rp-count" id="rp-count">0/0</span>
        <button class="rp-close" id="rp-close" data-i18n="replay_close"></button>
      </div>
    </div>

    <!-- ============ CONFIRM RESIGN ============ -->
    <div class="overlay" id="overlay-resign" hidden>
      <div class="modal">
        <h2 data-i18n="resign_confirm"></h2>
        <div class="modal-buttons row">
          <button class="btn-big btn-danger" id="btn-resign-yes" data-i18n="yes"></button>
          <button class="btn-big btn-outline" id="btn-resign-no" data-i18n="no"></button>
        </div>
      </div>
    </div>

    <!-- ============ HOW TO PLAY ============ -->
    <div class="overlay" id="overlay-how" hidden>
      <div class="modal">
        <h2 data-i18n="how_title"></h2>
        <p class="hint how-text" data-i18n="how_text"></p>
        <div class="modal-buttons">
          <button class="btn-big" id="btn-how-close">OK</button>
        </div>
      </div>
    </div>

    <!-- ============ NICKNAME CHANGED ============ -->
    <div class="overlay" id="overlay-nick-notice" hidden>
      <div class="modal">
        <h2 data-i18n="nick_changed_title"></h2>
        <p class="hint" id="nick-notice-text"></p>
        <div class="modal-buttons">
          <button class="btn-big" id="btn-nick-notice-close" data-i18n="ok_word"></button>
        </div>
      </div>
    </div>

    <!-- ============ ASK ABOUT NOTIFICATIONS ============ -->
    <!-- Shown once in a player's life, after a third match. The browser's own
         prompt is fired only for whoever says yes here, because that prompt
         gets one showing ever and a refusal to it can never be taken back. -->
    <div class="overlay" id="overlay-push" hidden>
      <div class="modal">
        <div class="modal-emoji">🔔</div>
        <h2 data-i18n="push_ask_title"></h2>
        <p class="hint" data-i18n="push_ask_body"></p>
        <div class="modal-buttons">
          <button class="btn-big" id="btn-push-yes" data-i18n="push_ask_yes"></button>
          <button class="btn-big btn-outline" id="btn-push-no" data-i18n="push_ask_no"></button>
        </div>
      </div>
    </div>

    <!-- ============ THE FLAME, EXPLAINED (opened by tapping it) ============ -->
    <!-- One window for everything the flame does: where the streak stands, the
         way back if it broke, how many free restores are left this month, and
         what the fire turns into as the days add up. It used to open only once
         the streak was already lost, which left the rules invisible to
         everyone still keeping one. -->
    <div class="overlay" id="overlay-streak-info" hidden>
      <div class="modal">
        <span class="flame fl-1 cel-flame" id="info-flame">🔥</span>
        <h2 id="info-title"></h2>
        <p class="hint" id="info-sub"></p>

        <button class="btn-big btn-restore" id="btn-restore-home" hidden></button>

        <div class="info-row">
          <span data-i18n="streak_free_label"></span><b id="info-free">1/1</b>
        </div>
        <p class="hint" data-i18n="streak_free_note"></p>

        <h3 class="info-h" data-i18n="streak_info_flames"></h3>
        <ul class="flame-list" id="info-flames"></ul>
        <p class="hint" data-i18n="streak_info_unlit"></p>

        <h3 class="info-h" data-i18n="streak_info_days"></h3>
        <p class="hint" data-i18n="streak_info_days_sub"></p>
        <p class="milestones" id="info-milestones"></p>

        <div class="modal-buttons">
          <button class="btn-big btn-outline" id="btn-info-close" data-i18n="close_word"></button>
        </div>
      </div>
    </div>

    <!-- ============ LEADERBOARD ============ -->
    <section class="screen" id="screen-leaderboard">
      <header class="sub-head center">
        <h2>🏆 <span data-i18n="leaderboard_title"></span></h2>
        <p class="hint" data-i18n="leaderboard_sub"></p>
      </header>
      <div id="lb-list" class="lb-list"></div>

      <!-- HilltopAds 300x250 banner, in the menu only and never in-game. Back
           under the table: above it, the ad was the first thing anyone opening
           the leaderboard saw, in place of the leaderboard. -->
      <div class="ad-slot ad-slot-lg" aria-hidden="true">
        <script>
        if (!window.WR_EMBED) (function(immt){
        var d = document,
            s = d.createElement('script'),
            l = d.scripts[d.scripts.length - 1];
        s.settings = immt || {};
        s.src = "\/\/massivesalad.com\/bwX.VrsEdqGmlv0\/YpW\/cC\/WeSm_9zuuZSU\/lokvPBTVcUyGNeTNUA2jMfz\/c\/trNIzTIm1ENVTtY-0\/MTQb";
        s.async = true;
        s.referrerPolicy = 'no-referrer-when-downgrade';
        l.parentNode.insertBefore(s, l);
        })({})
        </script>
      </div>
    </section>

    <!-- ============ PROFILE ============ -->
    <section class="screen" id="screen-profile">
      <header class="sub-head center">
        <h2 data-i18n="profile_title"></h2>
      </header>

      <div class="profile-card">
        <div class="avatar" id="profile-avatar">U</div>
        <h3 id="profile-nick">User0000</h3>
        <div class="rank-card">
          <div class="rank-badge" id="rank-badge">🟢</div>
          <div class="rank-meta">
            <b id="rank-name"></b>
            <small id="rank-points"></small>
            <div class="rank-bar" id="rank-bar"><i id="rank-fill"></i></div>
            <small class="rank-next" id="rank-next"></small>
          </div>
        </div>
        <div class="streak-card" id="streak-card">
          <!-- tappable here too: the same window opens from the home screen -->
          <button class="flame-btn" id="streak-flame-btn" aria-label="🔥">
            <span class="flame fl-1" id="streak-flame-big">🔥</span>
          </button>
          <div class="streak-meta">
            <b id="streak-days"></b>
            <small id="streak-sub"></small>
          </div>
        </div>
        <!-- Shown only when a streak was lost recently: one ad buys it back.
             The player chooses to watch, so nothing is taken from anyone. -->
        <button class="btn-big btn-restore" id="btn-restore-streak" hidden></button>
        <p class="veteran-badge" id="veteran-badge" data-i18n="veteran" hidden></p>
        <div class="stats-row" id="profile-stats">
          <div class="stat"><b id="stat-games">0</b><small data-i18n="stats_games"></small></div>
          <div class="stat"><b id="stat-wins">0</b><small data-i18n="stats_wins"></small></div>
          <div class="stat"><b id="stat-losses">0</b><small data-i18n="stats_losses"></small></div>
          <div class="stat"><b id="stat-rate">—</b><small data-i18n="stats_rate"></small></div>
        </div>
        <p class="hint" data-i18n="stats_online_note"></p>
        <p class="hint" id="guest-hint" data-i18n="guest_hint"></p>
      </div>

      <!-- guest: auth buttons -->
      <div id="auth-buttons" class="auth-box">
        <button class="btn-big" id="btn-show-login" data-i18n="login"></button>
        <button class="btn-big btn-outline" id="btn-show-register" data-i18n="register"></button>
      </div>

      <!-- auth form -->
      <div id="auth-form" class="auth-box" hidden>
        <input class="input" id="auth-email" type="email" data-i18n-ph="email" autocomplete="email">
        <input class="input" id="auth-password" type="password" data-i18n-ph="password" autocomplete="current-password">
        <input class="input" id="auth-nick" data-i18n-ph="nick_label" maxlength="16" hidden>
        <button class="btn-big" id="btn-auth-submit"></button>
        <button class="btn-link" id="btn-auth-toggle"></button>
        <button class="btn-link" id="btn-forgot" data-i18n="forgot"></button>
        <button class="btn-link" id="btn-auth-cancel" data-i18n="cancel"></button>
        <p class="auth-msg" id="auth-msg" hidden></p>
      </div>

      <div id="logged-box" class="auth-box" hidden>
        <button class="btn-big btn-outline" id="btn-logout" data-i18n="logout"></button>
      </div>

      <div class="settings-box">
        <div class="setting-row">
          <span data-i18n="lang_label"></span>
          <button class="lang-current" id="lang-current">🌐 English</button>
        </div>
        <div class="setting-row">
          <span data-i18n="vibration"></span>
          <label class="toggle"><input type="checkbox" id="vibro-toggle" checked><span></span></label>
        </div>
        <div class="setting-row">
          <span data-i18n="sound"></span>
          <label class="toggle"><input type="checkbox" id="sound-toggle" checked><span></span></label>
        </div>
        <div class="setting-row" id="install-row" hidden>
          <span data-i18n="install_app"></span>
          <button class="btn-mini" id="btn-install">📲</button>
        </div>
        <div class="setting-row">
          <span data-i18n="theme_label"></span>
          <label class="toggle"><input type="checkbox" id="theme-toggle"><span></span></label>
        </div>
        <!-- The game used to offer notifications exactly once, after a third
             match, and never again — so anyone who tapped past that prompt had
             no way back. Hidden where the browser has already refused. -->
        <div class="setting-row" id="push-row" hidden>
          <span data-i18n="push_label"></span>
          <label class="toggle"><input type="checkbox" id="push-toggle"><span></span></label>
        </div>
      </div>

      <!-- HilltopAds 300x250 banner, its own ad code so this slot is measured
           separately from the one on the leaderboard. Below the settings: the
           profile is read from the top down, and nothing here is in the way. -->
      <div class="ad-slot ad-slot-lg" aria-hidden="true">
        <script>
        if (!window.WR_EMBED) (function(usypz){
        var d = document,
            s = d.createElement('script'),
            l = d.scripts[d.scripts.length - 1];
        s.settings = usypz || {};
        s.src = "\/\/massivesalad.com\/bVXGV.sZdXGplL0oYoWmcJ\/Ie\/mg9\/uAZdUZl\/k\/PyTJcMyfN\/zBQv5KNmzDM\/t-NfzZIt3pNjDMk\/3vNYwP";
        s.async = true;
        s.referrerPolicy = 'no-referrer-when-downgrade';
        l.parentNode.insertBefore(s, l);
        })({})
        </script>
      </div>
    </section>

    <!-- ============ BOTTOM NAV ============ -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-screen="screen-home">
        <span class="nav-ico">🏠</span><span data-i18n="nav_home"></span>
      </button>
      <button class="nav-btn" data-screen="screen-leaderboard">
        <span class="nav-ico">🏆</span><span data-i18n="nav_leaderboard"></span>
      </button>
      <button class="nav-btn" data-screen="screen-profile">
        <span class="nav-ico">👤</span><span data-i18n="nav_profile"></span>
      </button>
    </nav>

    <div id="toast" hidden></div>
  </div>

  <script src="vendor/supabase.js?v=96" defer></script>
  <script type="module" src="js/app.js?v=96"></script>
</body>
</html>
